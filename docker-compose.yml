services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - clauseguard-net
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /app/data
      ARTIFACTS_DIR: /app/artifacts
      MODELS_DIR: /app/models
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./models:/app/models:ro
    depends_on:
      - qdrant
    networks:
      - clauseguard-net
    restart: unless-stopped

  mcp:
    profiles: ["mcp"]
    build: .
    command: ["python", "-m", "clauseguard.mcp.server"]
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /app/data
      ARTIFACTS_DIR: /app/artifacts
      MODELS_DIR: /app/models
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./models:/app/models:ro
    depends_on:
      - qdrant
      - api
    networks:
      - clauseguard-net

volumes:
  qdrant_storage:

networks:
  clauseguard-net:
    driver: bridge
